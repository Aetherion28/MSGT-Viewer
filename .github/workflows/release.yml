name: Release desktop apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
            command: npm run dist -- --win portable
          - os: macos-latest
            artifact: macos
            command: npm run dist -- --mac dmg --x64 --arm64
          - os: ubuntu-latest
            artifact: linux
            command: npm run dist -- --linux AppImage
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: web
      - run: node build.mjs
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - name: Package desktop app
        run: ${{ matrix.command }}
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: msgt-viewer-${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: msgt-viewer-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
              while read -r asset; do gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes; done
            gh release upload "$GITHUB_REF_NAME" artifacts/*
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --title "MSGT Viewer $GITHUB_REF_NAME"
          fi
